services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: supabase-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in stack/.env}"]
    depends_on:
      api-gw:
        condition: service_healthy
